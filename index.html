<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Legal · Kajlo</title>
  <style>
:root {
  --bg: #0d0d12;
  --elevated: #10141a;
  --surface: #141820;
  --text: #f2f5f8;
  --muted: rgba(242, 245, 248, 0.72);
  --accent: #00e5ff;
  --radius: 6px;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: linear-gradient(160deg, var(--bg), var(--elevated) 45%, #0a1f24);
  color: var(--text);
  line-height: 1.65;
  min-height: 100vh;
}
a { color: var(--accent); }
header {
  padding: 28px 20px 12px;
  max-width: 760px;
  margin: 0 auto;
}
header .brand {
  font-size: 28px;
  font-weight: 700;
  color: var(--accent);
  letter-spacing: -0.02em;
}
header nav { margin-top: 12px; font-size: 14px; }
header nav a { margin-right: 14px; text-decoration: none; }
header nav a:hover { text-decoration: underline; }
main {
  max-width: 760px;
  margin: 0 auto;
  padding: 8px 20px 64px;
}
article {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 28px 22px;
  border: 1px solid rgba(0, 229, 255, 0.12);
}
article h1 { margin-top: 0; font-size: 1.75rem; }
article h2 { margin-top: 1.6em; font-size: 1.25rem; color: var(--accent); }
article h3 { margin-top: 1.2em; font-size: 1.05rem; }
article table { width: 100%; border-collapse: collapse; margin: 1em 0; font-size: 0.95rem; }
article th, article td {
  border: 1px solid rgba(242, 245, 248, 0.16);
  padding: 8px 10px;
  text-align: left;
  vertical-align: top;
}
article th { background: rgba(0, 229, 255, 0.08); }
article code {
  background: rgba(0, 0, 0, 0.35);
  padding: 0.1em 0.35em;
  border-radius: 4px;
  font-size: 0.92em;
}
footer {
  max-width: 760px;
  margin: 0 auto;
  padding: 0 20px 40px;
  color: var(--muted);
  font-size: 13px;
}
</style>
</head>
<body>
  <header>
    <div class="brand">Kajlo</div>
    <nav>
      <a href="./">Home</a>
      <a href="./kajlo/terms/">Terms of Service</a>
      <a href="./kajlo/privacy/">Privacy Policy</a>
    </nav>
  </header>
  <main><article>
  <h1>Kajlo Legal</h1>
  <p>Official English legal documents for the Kajlo iOS app.</p>
  <ul>
    <li><a href="./kajlo/terms/">Terms of Service</a></li>
    <li><a href="./kajlo/privacy/">Privacy Policy</a></li>
  </ul>
</article></main>
  <footer>Kajlo legal · Bundle ID com.lhtdev.test · English only</footer>
</body>
</html>
